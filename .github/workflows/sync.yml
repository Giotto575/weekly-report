name: 同步腾讯文档

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync.mjs'
      - 'config.json'
      - '.github/workflows/sync.yml'

permissions:
  contents: write

concurrency:
  group: tencent-docs-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync gate (06:00-24:00 China, every 20 minutes)
        id: gate
        shell: bash
        run: |
          NOW=$(date -u +%s)
          CN_HOUR=$(TZ=Asia/Shanghai date +%H)

          case "$CN_HOUR" in
            00|01|02|03|04|05)
              echo "run_sync=false" >> "$GITHUB_OUTPUT"
              echo "Skip Tencent Docs: outside China-time sync window (06:00-24:00)."
              exit 0
              ;;
          esac

          LAST=0
          if [ -f data/sync-state.json ]; then
            LAST_ISO=$(jq -r '.lastAttemptAt // empty' data/sync-state.json)
            if [ -n "$LAST_ISO" ]; then
              LAST=$(date -d "$LAST_ISO" +%s 2>/dev/null || echo 0)
            fi
          fi

          AGE=$((NOW - LAST))
          if [ "$LAST" -gt 0 ] && [ "$AGE" -lt 1200 ]; then
            echo "run_sync=false" >> "$GITHUB_OUTPUT"
            echo "Skip Tencent Docs: last attempt was ${AGE}s ago (<1200s)."
            exit 0
          fi

          mkdir -p data
          ISO=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          printf '{\n  "lastAttemptAt": "%s"\n}\n' "$ISO" > data/sync-state.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sync-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record Tencent Docs sync attempt"
            git push
          fi

          echo "run_sync=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.gate.outputs.run_sync == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read Tencent Docs
        if: steps.gate.outputs.run_sync == 'true'
        env:
          TENCENT_DOCS_TOKEN: ${{ secrets.TENCENT_DOCS_TOKEN }}
        run: node scripts/sync.mjs

      - name: Commit updated web data
        if: steps.gate.outputs.run_sync == 'true' && success()
        run: |
          if git diff --quiet -- data/data.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git commit -m "chore: sync Tencent Docs"
          git push
